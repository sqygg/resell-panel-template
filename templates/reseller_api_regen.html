{% extends "base.html" %}
{% block title %}New Password · Astro Panel{% endblock %}
{% block content %}
<div class="page"><div class="container">
  <div class="card" style="max-width:560px;margin:2rem auto;padding:2rem;text-align:center;">
    <div class="logo" style="margin:0 auto 1rem;"><img src="/static/logo.png" alt="Astro" class="brand-logo" style="width:48px;height:48px;"></div>
    <h1>New Password Generated</h1>
    <p class="alert alert-err">Store this now — it won't be shown again. The old key is dead.</p>
    <code style="display:block;padding:0.75rem;border:1px solid var(--border);border-radius:0.5rem;margin:1rem 0;font-size:0.85rem;word-break:break-all;">{{ new_key }}</code>
    <button class="btn btn-ghost btn-sm" onclick="navigator.clipboard.writeText('{{ new_key }}');alert('Copied!')">Copy</button>
    <p class="muted" style="margin-top:1rem;font-size:0.82rem;">Your /auth password is this key.</p>
    <a href="/reseller/api" class="btn btn-primary" style="margin-top:1rem;">Done</a>
  </div>
</div></div>
{% endblock %}
