{% extends "store_base.html" %}
{% block title %}Sign in · SkriptX Panel{% endblock %}
{% block content %}
<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;">
    <div style="width:100%;max-width:420px;">
        <div style="text-align:center;margin-bottom:2rem;">
            <div style="width:56px;height:56px;border-radius:14px;background:var(--brand-gradient);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;"><img src="/static/logo.png" alt="SkriptX" class="brand-logo" style="width:48px;height:48px;"></div>
            <h1 style="font-size:1.6rem;font-weight:800;">Welcome to {{ brand_name }}</h1>
            <p style="color:var(--text-muted);margin-top:0.25rem;font-size:0.95rem;">Enter your password to sign in to your reseller account</p>
        </div>
        <form method="post" action="/store/login">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="username" required autofocus style="text-align:center;">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="password" required style="text-align:center;">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
        </form>
        <p style="text-align:center;margin-top:1.5rem;font-size:0.82rem;color:var(--text-dim);">
            Don't have login credentials? <a href="/store/apply" style="color:var(--accent);">Apply to become a reseller</a>
        </p>
    </div>
</div>
{% endblock %}
