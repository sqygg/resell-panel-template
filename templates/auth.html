{% extends "base.html" %}
{% block title %}Sign in · Astro Panel{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-top">
    <a href="/" class="brand-btn" aria-label="Home"><img src="/static/logo.png" alt="Astro" class="brand-logo"></a>
  </div>
  <div class="auth-card">
    <div class="logo"><img src="/static/logo.png" alt="Astro" class="brand-logo" style="width:48px;height:48px;"></div>
    <h1>Welcome to ASTRO</h1>
    <p class="sub">Enter your email and password to sign in to your reseller account</p>

    {% if error %}<div class="alert alert-err">{{ error }}</div>{% endif %}

    <form method="post" action="/auth">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@example.com" required autofocus value="{{ email or '' }}">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Your password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
    </form>

    <p class="muted" style="text-align:center;margin-top:1.5rem;">
      Don't have an account? <a href="/apply" style="color:#fff;">Apply to become a reseller</a>
    </p>
  </div>
</div>
{% endblock %}
