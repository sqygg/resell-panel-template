{% extends "base.html" %}
{% block title %}Sign in · Astro Panel{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-top">
    <a href="/" class="brand-btn" aria-label="Home"><img src="/static/logo.png" alt="Astro" class="brand-logo"></a>
  </div>
  <div class="auth-card">
    <div class="logo"><img src="/static/logo.png" alt="Astro" class="brand-logo" style="width:48px;height:48px;"></div>
    <h1>Welcome to ASTRO</h1>
    <p class="sub">Sign in with the API key the store owner issued you</p>
    {% if error %}<div class="alert alert-err">{{ error }}</div>{% endif %}
    <form method="post" action="/auth">
      <div class="form-group">
        <label>API key</label>
        <input type="password" name="api_key" placeholder="rs_..." required autofocus autocomplete="off">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Sign in</button>
    </form>
    <p class="muted" style="text-align:center;margin-top:1.5rem;">
      Don't have a key? <a href="/apply" style="color:#fff;">Apply to become a reseller</a>
    </p>
  </div>
</div>
{% endblock %}
