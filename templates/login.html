{% extends "base.html" %}
{% block content %}
<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;">
    <div style="width:100%;max-width:400px;">
        <div style="text-align:center;margin-bottom:2rem;">
            <div style="width:56px;height:56px;border-radius:14px;background:var(--brand-gradient);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;"><img src="/static/logo.png" alt="Astro" class="brand-logo" style="width:48px;height:48px;"></div>
            <h1 style="font-size:1.5rem;font-weight:800;">Admin Panel</h1>
            <p class="muted" style="margin-top:0.25rem;font-size:0.9rem;">Sign in to manage your resellers</p>
        </div>
        {% if request.query_params.get('error') %}
        <div style="background:var(--red-soft);color:var(--red);padding:0.75rem;border-radius:10px;margin-bottom:1rem;text-align:center;font-size:0.9rem;">
            {% if request.query_params.get('error') == 'rate_limited' %}Too many attempts. Try again later.{% else %}Invalid password{% endif %}
        </div>
        {% endif %}
        <form method="post" action="/login">
            <div class="form-group">
                <label>Admin Password</label>
                <input type="password" name="password" placeholder="Enter password..." required autofocus>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
